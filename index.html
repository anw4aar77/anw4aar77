<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyMusic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h1 class="logo">♫ MyMusic</h1>

        <button class="nav-btn active">
            🏠 Home
        </button>

        <button class="nav-btn">
            🔎 Search
        </button>

        <button class="nav-btn">
            ❤️ My Playlist
        </button>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <h2>Welcome back 👋</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search songs..."
            >

        </header>


        <!-- HOME -->
        <section>

            <h2>Popular Songs</h2>

            <div class="songs" id="songsList">

                <div class="song">

                    <img src="https://picsum.photos/100?random=1">

                    <div class="song-info">
                        <strong>Ocean Breeze</strong>
                        <span>Nova Echo</span>
                    </div>

                    <button
                        class="add-btn"
                        onclick="addToPlaylist('Ocean Breeze','Nova Echo')">
                        ＋
                    </button>

                    <button
                        class="play-btn"
                        onclick="playSong('Ocean Breeze','Nova Echo')">
                        ▶
                    </button>

                </div>


                <div class="song">

                    <img src="https://picsum.photos/100?random=2">

                    <div class="song-info">
                        <strong>Midnight Waves</strong>
                        <span>Nova Echo</span>
                    </div>

                    <button
                        class="add-btn"
                        onclick="addToPlaylist('Midnight Waves','Nova Echo')">
                        ＋
                    </button>

                    <button
                        class="play-btn"
                        onclick="playSong('Midnight Waves','Nova Echo')">
                        ▶
                    </button>

                </div>


                <div class="song">

                    <img src="https://picsum.photos/100?random=3">

                    <div class="song-info">
                        <strong>Night Drive</strong>
                        <span>Nova Echo</span>
                    </div>

                    <button
                        class="add-btn"
                        onclick="addToPlaylist('Night Drive','Nova Echo')">
                        ＋
                    </button>

                    <button
                        class="play-btn"
                        onclick="playSong('Night Drive','Nova Echo')">
                        ▶
                    </button>

                </div>

            </div>

        </section>


        <!-- PLAYLIST -->
        <section class="playlist-section">

            <h2>❤️ My Playlist</h2>

            <div id="playlist"></div>

        </section>

    </main>


    <!-- MUSIC PLAYER -->
    <div class="player">

        <div class="current-song">

            <img
                id="currentImage"
                src="https://picsum.photos/100?random=1"
            >

            <div>
                <strong id="currentTitle">
                    Nothing playing
                </strong>

                <span id="currentArtist">
                    Select a song
                </span>
            </div>

        </div>


        <div class="controls">

            <div class="progress-container">

                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progress"
                    value="0"
                    min="0"
                    max="100"
                >

                <span id="duration">0:00</span>

            </div>


            <div class="buttons">

                <button onclick="previousSong()">
                    ⏮
                </button>

                <button onclick="skip(-10)">
                    ↶ 10
                </button>

                <button
                    class="main-play"
                    id="mainPlay"
                    onclick="togglePlay()">
                    ▶
                </button>

                <button onclick="skip(10)">
                    10 ↷
                </button>

                <button onclick="nextSong()">
                    ⏭
                </button>

            </div>

        </div>


        <div class="volume">

            🔊

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="100"
            >

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
