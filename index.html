<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMusic</title>

    <!-- FontAwesome Library for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- DESKTOP SIDEBAR -->
    <aside class="sidebar">

        <!-- USER PROFILE BAR -->
        <div id="userProfileBar" class="user-profile-bar" style="display: none;">
            <span id="userNameDisplay"></span>
            <button onclick="logout()" class="logout-btn" title="Log Out">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>

        <h1 class="logo"><i class="fa-solid fa-compact-disc"></i> MyMusic</h1>

        <button class="nav-btn active" id="navHome" onclick="showHome()">
            <i class="fa-solid fa-house"></i> Home
        </button>

        <button class="nav-btn" id="navPlaylist" onclick="showPlaylist()">
            <i class="fa-solid fa-heart"></i> My Playlists
        </button>

        <button class="create-playlist-btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> Create Playlist
        </button>

    </aside>


    <main class="main">

        <!-- MOBILE NAVIGATION BAR -->
        <div class="mobile-nav">
            <button class="mobile-nav-btn active" onclick="showHome()">
                <i class="fa-solid fa-house"></i> Home
            </button>
            <button class="mobile-nav-btn" onclick="showPlaylist()">
                <i class="fa-solid fa-heart"></i> Playlists
            </button>
            <button class="mobile-nav-btn create-btn" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> New
            </button>
            <div id="mobileUserProfile" class="mobile-user-profile">
                <span id="mobileUserName"></span>
                <button onclick="logout()" class="mobile-logout-btn" title="Log Out"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <header class="topbar">

            <h2>MyMusic</h2>

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search YouTube..."
                    onkeydown="searchEnter(event)"
                >

                <button onclick="searchYouTube()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </header>


        <section id="homeSection">

            <!-- SEARCH FILTERS -->
            <div class="filter-container">
                <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                <button class="filter-btn" onclick="setFilter('music', this)">Music</button>
                <button class="filter-btn" onclick="setFilter('podcasts', this)">Podcasts</button>
            </div>

            <h2>Search Results</h2>

            <div id="results"></div>

        </section>


        <section id="playlistSection">

            <h2><i class="fa-solid fa-heart" style="color: #e74c3c;"></i> My Playlists</h2>

            <!-- PLAYLIST TABS / SELECTOR -->
            <div id="playlistTabs" class="playlist-tabs"></div>
<!-- PLAYLIST ACTION BUTTONS -->
<div class="playlist-share-controls" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
    <button onclick="shareCurrentPlaylist()" class="share-btn">
        <i class="fa-solid fa-share-nodes"></i> Share Current Playlist
    </button>
    <button onclick="openImportModal()" class="import-btn">
        <i class="fa-solid fa-file-import"></i> Import Playlist
    </button>
    <button onclick="openRenameModal()" class="action-btn">
        <i class="fa-solid fa-pen"></i> Rename
    </button>
    <button onclick="confirmDeleteCurrentPlaylist()" class="action-btn btn-danger">
        <i class="fa-solid fa-trash"></i> Delete
    </button>
</div>

<!-- RENAME PLAYLIST MODAL -->
<div id="renamePlaylistModal" class="modal">
    <div class="modal-content">
        <h3>Rename Playlist</h3>
        <input type="text" id="renamePlaylistInput" placeholder="Enter new name...">
        <div class="modal-buttons">
            <button onclick="confirmRenamePlaylist()">Save</button>
            <button class="cancel-btn" onclick="closeRenameModal()">Cancel</button>
        </div>
    </div>
</div>

            <!-- SONGS IN SELECTED PLAYLIST -->
            <div id="playlist"></div>

        </section>

    </main>


    <!-- AUTH MODAL (LOGIN / SIGNUP) -->
    <div id="authModal" class="modal" style="display: flex;">
        <div class="modal-content auth-box">
            <h3 id="authTitle">Login to MyMusic</h3>
            
            <input type="text" id="authUsername" placeholder="Username (e.g. hamoda11)" required>
            <input type="password" id="authPassword" placeholder="Password" required>
            
            <div class="modal-buttons" style="flex-direction: column;">
                <button id="authPrimaryBtn" onclick="handleAuth()">Login</button>
                <p style="color:#aaa; font-size:12px; margin-top:10px;">
                    <span id="authToggleText">Don't have an account?</span> 
                    <a href="#" id="authToggleLink" onclick="toggleAuthMode(event)" style="color:#1ed760;">Sign Up</a>
                </p>
            </div>
        </div>
    </div>


    <!-- CREATE PLAYLIST MODAL -->
    <div id="playlistModal" class="modal">
        <div class="modal-content">
            <h3>Create New Playlist</h3>
            <input type="text" id="newPlaylistName" placeholder="Playlist Name...">
            <div class="modal-buttons">
                <button onclick="saveNewPlaylist()">Create</button>
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>


    <!-- IMPORT PLAYLIST MODAL -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <h3>Import Shared Playlist</h3>
            <input type="text" id="importCodeInput" placeholder="Paste playlist code here...">
            <div class="modal-buttons">
                <button onclick="importPlaylist()">Add to My Account</button>
                <button class="cancel-btn" onclick="closeImportModal()">Cancel</button>
            </div>
        </div>
    </div>


    <!-- ADD TO PLAYLIST MODAL WITH BUTTONS -->
    <div id="addToPlaylistModal" class="modal">
        <div class="modal-content">
            <h3>Select Playlist</h3>
            <div id="playlistButtonsContainer" class="playlist-buttons-list"></div>
            <button class="cancel-btn" onclick="closeSelectPlaylistModal()" style="width: 100%; margin-top: 15px;">Cancel</button>
        </div>
    </div>


    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>


    <!-- YOUTUBE PLAYER -->
    <div id="youtubePlayer"></div>


    <!-- MUSIC PLAYER -->
    <div class="player">

        <div class="current-song">

            <div class="img-container">
                <img
                    id="currentImage"
                    src="https://via.placeholder.com/60"
                >
                <!-- AUDIO EQUALIZER ANIMATION -->
                <div id="equalizer" class="equalizer">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div>

                <strong id="currentTitle">
                    Nothing playing
                </strong>

                <span id="currentArtist">
                    Search for a song
                </span>

            </div>

        </div>


        <div class="controls">

            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>


            <div class="buttons">

                <button id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>

                <button onclick="previousSong()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button onclick="skip(-10)">
                    <i class="fa-solid fa-rotate-left"></i> 10
                </button>

                <button
                    class="main-play"
                    id="mainPlay"
                    onclick="togglePlay()"
                >
                    <i class="fa-solid fa-play"></i>
                </button>

                <button onclick="skip(10)">
                    10 <i class="fa-solid fa-rotate-right"></i>
                </button>

                <button onclick="nextSong()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <button id="repeatBtn" onclick="toggleRepeat()" title="Repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>

            </div>

        </div>


        <div class="volume">

            <!-- SLEEP TIMER MENU -->
            <div class="sleep-timer-wrapper">
                <button id="sleepTimerBtn" onclick="toggleSleepMenu()" title="Sleep Timer">
                    <i class="fa-solid fa-moon"></i>
                    <span id="timerBadge" class="timer-badge"></span>
                </button>

                <div id="sleepMenu" class="sleep-menu">
                    <h4>Sleep Timer</h4>
                    <button onclick="setSleepTimer(5)">5 Minutes</button>
                    <button onclick="setSleepTimer(15)">15 Minutes</button>
                    <button onclick="setSleepTimer(30)">30 Minutes</button>
                    <button onclick="setSleepTimer(60)">1 Hour</button>
                    <button class="cancel-timer-btn" onclick="cancelSleepTimer()">Turn Off</button>
                </div>
            </div>

            <i class="fa-solid fa-volume-high" id="volumeIcon" onclick="toggleMute()" style="cursor: pointer;"></i>

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="100"
                oninput="changeVolume()"
            >

        </div>

    </div>


    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>

</body>

</html>
