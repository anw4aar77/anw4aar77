<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyMusic</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">

        <h1 class="logo">♫ MyMusic</h1>

        <button class="nav-btn active" onclick="showHome()">
            🏠 Home
        </button>

        <button class="nav-btn" onclick="showPlaylist()">
            ❤️ My Playlist
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <h2>MyMusic</h2>

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search YouTube..."
                    onkeydown="searchEnter(event)"
                >

                <button onclick="searchYouTube()">
                    🔎
                </button>

            </div>

        </header>


        <section id="homeSection">

            <h2>Search Results</h2>

            <div id="results"></div>

        </section>


        <section id="playlistSection">

            <h2>❤️ My Playlist</h2>

            <div id="playlist"></div>

        </section>

    </main>


    <!-- YOUTUBE PLAYER -->

    <div id="youtubePlayer"></div>


    <!-- MUSIC PLAYER -->

    <div class="player">

        <div class="current-song">

            <img
                id="currentImage"
                src="https://via.placeholder.com/60"
            >

            <div>

                <strong id="currentTitle">
                    Nothing playing
                </strong>

                <span id="currentArtist">
                    Search for a song
                </span>

            </div>

        </div>


        <div class="controls">

            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>


            <div class="buttons">

                <button onclick="previousSong()">
                    ⏮
                </button>

                <button onclick="skip(-10)">
                    ↶ 10
                </button>

                <button
                    class="main-play"
                    id="mainPlay"
                    onclick="togglePlay()"
                >
                    ▶
                </button>

                <button onclick="skip(10)">
                    10 ↷
                </button>

                <button onclick="nextSong()">
                    ⏭
                </button>

            </div>

        </div>


        <div class="volume">

            🔊

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="100"
                oninput="changeVolume()"
            >

        </div>

    </div>


    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="script.js"></script>

</body>

</html>
