<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMusic</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">

        <h1 class="logo"><i class="fa-solid fa-compact-disc"></i> MyMusic</h1>

        <button class="nav-btn active" id="navHome" onclick="showHome()">
            <i class="fa-solid fa-house"></i> Home
        </button>

        <button class="nav-btn" id="navPlaylist" onclick="showPlaylist()">
            <i class="fa-solid fa-heart"></i> My Playlists
        </button>

        <button class="create-playlist-btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> Create Playlist
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <h2>MyMusic</h2>

            <div class="search-box">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search YouTube..."
                    onkeydown="searchEnter(event)"
                >

                <button onclick="searchYouTube()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </header>


        <section id="homeSection">

            <div class="filter-container">
                <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                <button class="filter-btn" onclick="setFilter('music', this)">Music</button>
                <button class="filter-btn" onclick="setFilter('podcasts', this)">Podcasts</button>
            </div>

            <h2>Search Results</h2>

            <div id="results"></div>

        </section>


        <section id="playlistSection">

            <h2><i class="fa-solid fa-heart" style="color: #e74c3c;"></i> My Playlists</h2>

            <div id="playlistTabs" class="playlist-tabs"></div>

            <div id="playlist"></div>

        </section>

    </main>


    <div id="playlistModal" class="modal">
        <div class="modal-content">
            <h3>Create New Playlist</h3>
            <input type="text" id="newPlaylistName" placeholder="Playlist Name...">
            <div class="modal-buttons">
                <button onclick="saveNewPlaylist()">Create</button>
                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>


    <div id="addToPlaylistModal" class="modal">
        <div class="modal-content">
            <h3>Select Playlist</h3>
            <div id="playlistButtonsContainer" class="playlist-buttons-list"></div>
            <button class="cancel-btn" onclick="closeSelectPlaylistModal()" style="width: 100%; margin-top: 15px;">Cancel</button>
        </div>
    </div>


    <div id="youtubePlayer"></div>


    <div class="player">

        <div class="current-song">

            <img
                id="currentImage"
                src="https://via.placeholder.com/60"
            >

            <div>

                <strong id="currentTitle">
                    Nothing playing
                </strong>

                <span id="currentArtist">
                    Search for a song
                </span>

            </div>

        </div>


        <div class="controls">

            <div class="progress-container">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">
                    0:00
                </span>

            </div>


            <div class="buttons">

                <button id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>

                <button onclick="previousSong()">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button onclick="skip(-10)">
                    <i class="fa-solid fa-rotate-left"></i> 10
                </button>

                <button
                    class="main-play"
                    id="mainPlay"
                    onclick="togglePlay()"
                >
                    <i class="fa-solid fa-play"></i>
                </button>

                <button onclick="skip(10)">
                    10 <i class="fa-solid fa-rotate-right"></i>
                </button>

                <button onclick="nextSong()">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <button id="repeatBtn" onclick="toggleRepeat()" title="Repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>

            </div>

        </div>


        <div class="volume">

            <i class="fa-solid fa-volume-high"></i>

            <input
                type="range"
                id="volume"
                min="0"
                max="100"
                value="100"
                oninput="changeVolume()"
            > 

        </div>

    </div>


    <script src="https://www.youtube.com/iframe_api"></script>

    <script src="script.js"></script>

</body>

</html>
