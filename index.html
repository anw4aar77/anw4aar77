<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOON DEFENDERS</title>
<meta name="md-api" content="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#07060c;--p:#12101c;--ln:#3a3050;--gold:#e8c36a;--gold2:#a8802f;--cr:#e0435b;--teal:#5fd4e0;--vi:#8a6bff;--t:#f3eee2;--m:#9b93ad;--ok:#58e6a0;--g:#e8c36a;--r:#e0435b;--n:#5fd4e0;--b:#3a3050;--v:#8a6bff;--fh:Cinzel,"Trajan Pro","Palatino Linotype",Georgia,serif;font-family:Rajdhani,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-size:17px;color:var(--t);background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(55% 45% at 80% 0,#5a1a3a77,transparent 70%),radial-gradient(50% 50% at 0 30%,#1b3a5c66,transparent 70%),radial-gradient(60% 40% at 50% 115%,#3a2a0e66,transparent 70%),linear-gradient(#0a0812,#07060c)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,#000b)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.top{display:contents}
header{position:fixed;z-index:40;top:env(safe-area-inset-top,0px);left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;background:linear-gradient(#0c0912f2,#0c0912d9);backdrop-filter:blur(12px);border-bottom:1px solid #e8c36a44;box-shadow:0 6px 30px #000a}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.logo{display:flex;align-items:center;gap:10px;font:900 19px var(--fh);letter-spacing:3px;color:var(--gold);text-shadow:0 0 18px #e8c36a66;white-space:nowrap}
.logo svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 8px #e8c36a)}
.stats{display:flex;gap:8px;align-items:center}
.pill{padding:4px 13px;border:1px solid #e8c36a55;border-radius:6px;background:linear-gradient(#1c1628,#100c1a);font-weight:700;white-space:nowrap;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-inline:16px}
.pill:empty{display:none}#hc{color:var(--gold)}#hd{color:#8fe9f5}#hl{color:#f0b8ff}#hn{color:var(--t)}
.xp{width:110px;height:10px;border-radius:2px;background:#0b0813;overflow:hidden;border:1px solid #e8c36a55;transform:skewX(-18deg)}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold),#fff3c0);transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px var(--gold)}
#lo{display:none;padding:5px 12px}body.in #lo{display:inline-block}
nav{position:fixed;z-index:35;left:0;top:calc(62px + env(safe-area-inset-top,0px));bottom:0;width:92px;display:flex;flex-direction:column;gap:2px;padding:10px 6px;overflow-y:auto;background:linear-gradient(90deg,#0c0912f2,#0c091299);border-right:1px solid #e8c36a33;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav:empty{display:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;font-size:12px;line-height:1.1;text-align:center;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--m);box-shadow:none;letter-spacing:.4px;position:relative}
nav button .ni{font-size:21px;font-style:normal;transition:transform .2s}
nav button:hover:not(:disabled){color:#fff;background:#ffffff0d;border-color:#e8c36a33;box-shadow:none;transform:none}nav button:hover .ni{transform:scale(1.18)}
nav button.on{color:var(--gold);background:linear-gradient(90deg,#e8c36a26,transparent);border-color:#e8c36a44}
nav button.on::before{content:"";position:absolute;left:-7px;top:18%;bottom:18%;width:3px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
button{font:inherit;font-weight:700;letter-spacing:.5px;color:var(--t);background:linear-gradient(#2a2238,#1a1426);border:1px solid #5a4a78;padding:8px 18px;border-radius:8px;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;box-shadow:inset 0 1px #fff2,0 3px 10px #0007}
button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);box-shadow:0 0 18px #e8c36a44,0 6px 14px #0008}
button:active:not(:disabled){transform:scale(.96)}button:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
button.on{background:linear-gradient(#f0cf7a,#b8862f);color:#2a1a00;border-color:#fff0b0;box-shadow:0 0 22px #e8c36a66,inset 0 1px #fff9;text-shadow:0 1px #fff5}
button.gold{background:linear-gradient(#f0cf7a,#b8862f);color:#2a1a00;border-color:#fff0b0;box-shadow:0 0 14px #e8c36a44,inset 0 1px #fff9}
button.danger{background:linear-gradient(#5a1830,#3a0f20);border-color:#e0435b99}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{padding:84px 22px 60px 114px;position:relative}body:not(.in) main{padding-left:22px}
.pg{max-width:1120px;margin:0 auto}
h2{margin:0 0 6px;font:900 26px var(--fh);letter-spacing:2px;color:var(--gold);text-shadow:0 0 20px #e8c36a44}
.sub{margin:0 0 18px;color:var(--m)}small{color:var(--m)}
.eyebrow{display:block;font:700 12px var(--fh);letter-spacing:3px;color:var(--teal)}
.panel{position:relative;background:linear-gradient(160deg,#1a1526ee,#0e0b18ee);border:1px solid #e8c36a33;border-radius:12px;padding:14px;box-shadow:0 12px 30px #0008,inset 0 1px #ffffff12}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--gold);opacity:.7}.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:12px}.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:12px}
.ptitle{display:block;font:700 13px var(--fh);letter-spacing:3px;color:var(--gold);margin-bottom:10px}
/* home */
.dash{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}
.stage{position:relative;min-height:400px;border-radius:16px;overflow:hidden;border:1px solid var(--rc);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 40%,transparent),0 20px 50px #000a;display:flex;align-items:flex-end;background:#0b0813}
.keyart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 15%;transform:scale(1.04);transition:transform 8s ease-out}.stage:hover .keyart{transform:scale(1.12)}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07060cf5 8%,#07060c88 45%,transparent 75%),radial-gradient(80% 60% at 20% 100%,color-mix(in srgb,var(--rc) 35%,transparent),transparent)}
.stage-t{position:relative;z-index:2;padding:22px;max-width:640px}.stage-t h1{margin:4px 0;font:900 clamp(30px,5vw,52px) var(--fh);letter-spacing:2px;text-shadow:0 4px 24px #000}.stage-t p{margin:0 0 14px;color:#d9d2e6;font-size:18px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.cta{font:700 16px var(--fh);padding:13px 26px;border-radius:10px;letter-spacing:1.5px}
.side{display:grid;gap:14px;align-content:start}.squad{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.sq{width:72px;text-align:center;font-size:13px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;border:2px solid var(--rc);box-shadow:0 0 10px var(--rc);overflow:hidden;background:#0b0a1c;flex:none}.av img{width:100%;height:100%;object-fit:cover}.sq .av{width:64px;height:64px;margin:0 auto 4px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{text-align:center;padding:12px 8px}.tile b{display:block;font:900 24px var(--fh);color:var(--gold)}.tile small{font-weight:700;letter-spacing:2px;font-size:12px}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}.tl button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;position:relative}.ti{font-size:30px}
.dot{position:absolute;top:8px;right:10px;font:700 10px var(--fh);color:#2a1a00;background:var(--gold);border-radius:20px;padding:1px 7px;animation:blink 1.6s infinite}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:linear-gradient(170deg,color-mix(in srgb,var(--rc,#3a3050) 24%,#161120),#0b0813 72%);border:1px solid color-mix(in srgb,var(--rc,#3a3050) 80%,#000);box-shadow:0 0 20px color-mix(in srgb,var(--rc,#000) 30%,transparent),0 14px 26px #000a;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-7px) scale(1.015);box-shadow:0 0 38px color-mix(in srgb,var(--rc,#000) 65%,transparent),0 20px 34px #000b}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff26 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}.card:hover::after{transform:translateX(120%);transition:transform .8s}
.pt{position:relative;height:156px;overflow:hidden;font-size:50px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc,#5fd4e0) 55%,#0b0813),#0b0813)}
.pt img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .5s}.card:hover .pt img{transform:scale(1.1)}
.pt::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#0b0813);pointer-events:none}
.rar{color:var(--rc);font-weight:700}
.rb{position:absolute;top:9px;left:9px;z-index:3;font:700 10px var(--fh);letter-spacing:2px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--rc),#000a);padding:3px 10px;border:1px solid #fff6;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);padding-inline:12px}
.lk{position:absolute;z-index:3;right:10px;bottom:8px;font-size:22px}
.cb{padding:10px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}.cb>button{margin-top:auto}
.nm{font:700 15px var(--fh);letter-spacing:.8px}.origin{font-size:13px;color:var(--m)}.ab{font-size:14px;line-height:1.25;min-height:36px}
.sts{display:grid;gap:4px;margin:4px 0 6px}.st{display:grid;grid-template-columns:34px 1fr 40px;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--m)}.st em{font-style:normal;color:var(--t);text-align:right}
.sb{height:6px;background:#05040a;border-radius:2px;overflow:hidden;transform:skewX(-20deg)}.sb i{display:block;height:100%;background:linear-gradient(90deg,var(--rc),#fff);box-shadow:0 0 8px var(--rc)}
.card.lock .pt img,.card.lock .nm{filter:grayscale(1) brightness(.5)}
.r2:hover{box-shadow:0 0 44px #b05cffaa,0 20px 34px #000b}
.r3::before,.r4::before{content:"";position:absolute;inset:0;z-index:4;padding:2px;border-radius:inherit;pointer-events:none;background:conic-gradient(from var(--a),#ffd76a,#ff8a2a,#fff4b8,#c98a1a,#ffd76a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 5s linear infinite}
.r4::before{background:conic-gradient(from var(--a),#ff3d8b,#8a6bff,#5fd4e0,#ff3d8b,#ffd1e8,#ff3d8b)}
.r3 .pt::before,.r4 .pt::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(2px 2px at 18% 90%,#ffe9a0,transparent),radial-gradient(2px 2px at 52% 96%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 88%,#ffd76a,transparent),radial-gradient(2px 2px at 35% 100%,#fff4,transparent);animation:rise 3.2s linear infinite}
.r4 .pt::before{background:radial-gradient(2px 2px at 18% 90%,#ff9ac2,transparent),radial-gradient(2px 2px at 52% 96%,#fff,transparent),radial-gradient(1.5px 1.5px at 80% 88%,#b9a6ff,transparent),radial-gradient(2px 2px at 35% 100%,#7fe8ff,transparent)}
.r4{animation:aura 3s ease-in-out infinite}
/* missions */
.sec{margin:26px 0 12px;font:700 14px var(--fh);letter-spacing:4px;color:var(--gold);display:flex;align-items:center;gap:14px}.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e8c36a99,transparent)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mc{position:relative;overflow:hidden;display:grid;grid-template-columns:62px 1fr;gap:6px 14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 20%,#161120),#0b0813 75%);border:1px solid color-mix(in srgb,var(--mc) 55%,#222);box-shadow:0 0 18px color-mix(in srgb,var(--mc) 22%,transparent),0 12px 24px #0009;transition:transform .25s,box-shadow .25s}
.mc::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mc) 40%,transparent),transparent 70%);pointer-events:none}
.mc:hover{transform:translateY(-5px);box-shadow:0 0 34px color-mix(in srgb,var(--mc) 55%,transparent),0 16px 28px #000a}.mc.lk2{opacity:.45;filter:grayscale(.8)}
.mn{grid-row:span 4;align-self:start;height:62px;display:flex;align-items:center;justify-content:center;font:900 26px var(--fh);color:var(--mc);background:#05040acc;border:1px solid color-mix(in srgb,var(--mc) 60%,transparent);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 0 14px var(--mc)}
.mc b{font:700 15px var(--fh);letter-spacing:.5px}.mc button{justify-self:start}
.tags{display:flex;flex-wrap:wrap;gap:5px}.tg{font-size:13px;font-weight:700;padding:2px 9px;border-radius:4px;background:#05040acc;border:1px solid #ffffff22}
.tg.df{color:var(--mc);border-color:var(--mc)}.tg.c{color:var(--gold)}.tg.d{color:#8fe9f5}.tg.ok{color:var(--ok);border-color:var(--ok)}
/* battle */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.ph h2{margin:0}
.hud{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px;padding:10px 14px}
.chip{padding:3px 12px;border-radius:4px;background:#05040acc;border:1px solid #e8c36a55;font-weight:700;color:var(--gold)}.bl{color:var(--m);font:700 12px var(--fh);letter-spacing:2px}
.bar{width:180px;height:14px;background:#2a0f1c;border-radius:3px;overflow:hidden;border:1px solid #8a2a48;transform:skewX(-18deg)}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cr),#ff9a6a);transition:width .25s;box-shadow:0 0 10px var(--cr)}
.team{display:flex;align-items:center;gap:6px;margin-left:auto}
.cw{position:relative;border:1px solid #e8c36a66;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #0b0813,0 0 0 5px #e8c36a33,0 24px 50px #000b}
canvas{display:block;width:100%;height:auto;background:#080716}
.obj{margin-bottom:12px;padding:10px 14px;text-align:left}.obj ul{margin:6px 0 4px;padding-left:20px}
.bi{position:absolute;left:0;right:0;top:30%;z-index:6;text-align:center;pointer-events:none;padding:14px 0;background:linear-gradient(90deg,transparent,#7a0f2acc 25%,#7a0f2acc 75%,transparent);animation:bi 2.6s both}.bi small{display:block;color:#ffb0c0;font:700 13px var(--fh);letter-spacing:8px}.bi b{font:900 clamp(22px,5vw,42px) var(--fh);letter-spacing:4px;color:#fff;text-shadow:0 0 24px #ff3d5a}
.ov{position:absolute;inset:0;z-index:7;background:radial-gradient(circle,#150a1ef2,#05030af5);display:flex;padding:12px;overflow:auto}
.res{position:relative;margin:auto;max-width:540px;width:100%;text-align:center;padding:20px 16px;border-radius:16px;background:linear-gradient(160deg,#1c1528ee,#0c0914f2);border:1px solid var(--rc2);box-shadow:0 0 50px var(--rc2)}
.res::before{content:"";position:absolute;inset:-40%;z-index:-1;background:repeating-conic-gradient(from 0deg,var(--rc2) 0 4deg,transparent 4deg 16deg);opacity:.12;animation:spin2 40s linear infinite;pointer-events:none}
.res.win{--rc2:#e8c36aaa}.res.lose{--rc2:#e0435baa}.res h2{font-size:clamp(22px,5.5vw,36px);letter-spacing:6px}.res.win h2{color:var(--gold)}.res.lose h2{color:var(--cr)}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}.rg div{background:#05040acc;border:1px solid #ffffff1a;border-radius:8px;padding:6px 8px}.rg small{display:block;font-size:12px}.rg b{font:700 17px var(--fh);color:var(--gold)}
.orel{margin:0 0 12px;font-weight:700;color:var(--gold)}.rbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.res-o{margin:0 0 12px;font-size:14px;text-align:left}.res-o div{margin:2px 0}
.cf{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:fall 1.8s ease-in both}
/* lists */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(160deg,#1a1526dd,#0e0b18dd);border:1px solid #e8c36a2a;border-radius:10px;margin-bottom:8px;flex-wrap:wrap;transition:border-color .2s}.row:hover{border-color:#e8c36a88}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button img{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
.upl{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:20px;align-items:start}.ug{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.pips{grid-column:1/-1;height:8px;border-radius:2px;background:#05040a;overflow:hidden;border:1px solid #ffffff14;transform:skewX(-18deg)}.pips i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 10px var(--gold);transition:width .4s}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.si{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}.ic{font-size:42px;filter:drop-shadow(0 0 12px var(--oc,#e8c36a))}
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;margin-bottom:16px}
.slot{text-align:center;padding:14px 6px;border-radius:10px;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--oc) 30%,#0e0b18),#08060f);border:1px solid var(--oc);box-shadow:0 0 18px color-mix(in srgb,var(--oc) 35%,transparent);transition:transform .2s}.slot:hover{transform:translateY(-4px)}.slot .ic{font-size:32px}.slot b{display:block;font:900 20px var(--fh)}
.pf{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.pav{width:88px;height:88px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 26px #e8c36a77;object-fit:cover}.pf h2{margin:0}
.rk{font:900 16px var(--fh);min-width:46px;text-align:center}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.dc{position:relative;text-align:center;padding:14px 8px;border-radius:12px;background:linear-gradient(160deg,#1a1526,#0e0b18);border:1px solid #e8c36a33;display:flex;flex-direction:column;gap:4px;align-items:center}.di{font-size:38px}
.dc.cl{opacity:.5}.dc.cl::after{content:"✓";position:absolute;top:6px;right:10px;color:var(--ok);font-size:22px}.dc.now{border-color:var(--gold);box-shadow:0 0 24px #e8c36a66}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #ffffff12}.set:last-child{border:0}
/* auth */
.gate{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:center;min-height:calc(100vh - 150px)}
.gate-art h1{font:900 clamp(38px,7vw,78px) var(--fh);line-height:1;letter-spacing:5px;margin:8px 0 12px;color:var(--gold);text-shadow:0 0 40px #e8c36a66}

 <div class="sec">WEEKLY EVENT</div><div class="panel fr-ev"><div class="fr-evh"><span class="ic" style="font-size:40px">${ev.t.e}</span><div style="flex:1;min-width:180px"><span class="eyebrow">${ev.days} DAY${ev.days>1?'S':''} LEFT</span><b class="nm" style="font-size:20px">${ev.t.n}: ${ev.t.d}</b><br><small>Reward: 🌟 12 + 🌙 3 + 📦 1</small><div class="pips" style="margin-top:8px"><i style="width:${pct(ev.p,ev.t.g)}%"></i></div></div><b>${ev.p}/${ev.t.g}</b><button class="${ev.ev.done||ev.p<ev.t.g?'':'gold'}" ${ev.ev.done||ev.p<ev.t.g?'disabled':''} onclick="frEv()">${ev.ev.done?'Claimed':'Claim'}</button></div>${wkend()?'<div class="fr-surge">⚡ Weekend Surge active: ×2 mission Fragments and ×1.5 Fragment drop rates</div>':'<small>Weekend Surge (Saturday and Sunday): ×2 mission Fragments, ×1.5 drop rates.</small>'}</div>
 <div class="sec">DAILY TASKS</div>${dts}<div class="row"><span><b>All tasks bonus</b> <small>🌙 1 Moon Fragment + 📦 1 chest</small></span><button class="${dt.all||!all?'':'gold'}" ${dt.all||!all?'disabled':''} onclick="frDTAll()">${dt.all?'Claimed':'Claim bonus'}</button></div>
 <div class="sec">TREASURE CHESTS</div><div class="row"><span><b>📦 Chests: ${f.ch}</b><br><small>Chests come from daily tasks, first mission clears, boss kills, events and mini-games. Each holds Fragments and coins.</small></span><span><button class="${free?'gold':''}" ${free?'':'disabled'} onclick="frFree()">${free?'Free daily chest':'Daily chest claimed'}</button> <button class="on" ${f.ch?'':'disabled'} onclick="frOpen()">Open chest</button></span></div>
 <div class="sec">MINI-GAMES</div><div class="dgrid"><div class="panel si"><span class="ic">🌟</span><b>Shard Rush</b><small>Fast reaction game. Up to 🌟 7 + 🧩 + 🌙 per run.</small><small>Plays left today: ${3-mg.a}/3</small><button class="gold" ${mg.a>=3?'disabled':''} onclick="frRush()">Play</button></div><div class="panel si"><span class="ic">🌙</span><b>Moon Memory</b><small>Repeat the sequence. Up to 🌟 7 + 🧩 + 🌙 per run.</small><small>Plays left today: ${3-mg.b}/3</small><button class="gold" ${mg.b>=3?'disabled':''} onclick="frMem()">Play</button></div></div>
 <div class="sec">FRAGMENT FORGE</div>${ORE.filter(o=>ORC[o.id]).map(o=>forge(o.e+' '+ORC[o.id]+' '+o.n+' → 🌟 1','Owned: '+(S.ore[o.id]|0),"frOre('"+o.id+"')",(S.ore[o.id]|0)>=ORC[o.id])).join('')}
 ${forge('💎 3 Diamond Ore → 🌙 1','Owned: '+(S.ore.diamond|0),'frDia()',(S.ore.diamond|0)>=3)}${forge('🪙 2,500 coins → 🌟 1','Today: '+lim.c+'/10',"frCoin()",lim.c<10&&S.c>=2500)}${forge('💎 30 diamonds → 🌙 1','Today: '+lim.g+'/2',"frGem()",lim.g<2&&S.d>=30)}
 <div class="sec">WHERE TO FIND FRAGMENTS</div><div class="panel"><small>🗺️ Clearing missions (🌟 + 🧩 for every hero on your team, first clears give a chest) · 👹 Bosses (guaranteed 🌟 + 🧩 for your team, chance of a chest) · 🎯 Elite mission objectives (🌟 + 🌙) · ⚔️ Enemy drops while fighting (elites drop more, replays drop 30% less) · ⛏️ Ore Forge · 🎁 Daily reward streak (🌙 on day 7) · 🏅 Achievements · ⬆️ Level-ups · 📅 Daily tasks and the weekly event · 📦 Chests · 🎮 Mini-games.</small></div></div>`}

function resFrag(){const r=$('.res'),b=r&&r.querySelector('.rbtn'),t=G.frg&&fmtG(G.frg);if(b&&t&&!r.querySelector('.fr-res'))b.insertAdjacentHTML('beforebegin','<div class="fr-res"><b>Fragments found</b><br>'+t+'</div>')}
function menuTile(){const t=$('.tl');if(!t||t.querySelector('.fr-tile'))return;const n=Object.keys(S.own).filter(i=>canEvo(+i)).length;t.insertAdjacentHTML('beforeend',`<button class="fr-tile" onclick="go('evo')"><span class="ti">🧬</span>Evolution${n?'<span class="dot">'+n+' READY</span>':''}</button><button class="fr-tile" onclick="go('frag')"><span class="ti">🌟</span>Fragments${claimables()?'<span class="dot">NEW</span>':''}</button>`)}
function decor(){$$('.card').forEach(c=>{const nm=c.querySelector('.nm');if(!nm||c.classList.contains('evd'))return;const id=CH.findIndex(h=>h.n==nm.textContent);if(id<0||!S.own[id])return;const e=EV(id);if(!e)return;c.classList.add('evd','ev'+e);const pt=c.querySelector('.pt');if(pt)pt.insertAdjacentHTML('beforeend','<span class="evb" title="'+EVD[id].f[e-1]+'">'+'★'.repeat(e)+'</span>')})}
const _render=render;
render=function(p){_render(p);if(!S)return;try{if(p=='evo')pageEvo();else if(p=='frag')pageFrag();else if(p=='play'){if(G&&G.done)resFrag()}else if(p=='menu')menuTile();else if(p=='col'||p=='shop'||p=='up')decor()}catch(e){console.error(e);toast('Could not draw this page')}};
setInterval(()=>{const p=$('#hf');if(!p)return;if(S){const f=F();p.textContent='🌟 '+f.s+'  🌙 '+f.m}else p.textContent=''},400);
})();
</script>
</body></html>
